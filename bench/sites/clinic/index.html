<!doctype html>
<html lang="en" data-site="clinic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverside Family Clinic - Appointments</title>
<style>
  body { margin: 0; font: 15px/1.5 Georgia, "Times New Roman", serif; background: #fbf8f3; color: #2d2a26; }
  .top { background: #fff; border-bottom: 3px solid #7a9e7e; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; }
  .wrap { max-width: 920px; margin: 26px auto; padding: 0 20px; }
  .tabs { display: flex; gap: 2px; margin-bottom: 18px; }
  .tab { padding: 10px 18px; background: #ebe5da; font-family: system-ui, sans-serif; font-size: 14px; }
  .tab.on { background: #7a9e7e; color: #fff; }
  .docs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .doc { background: #fff; border: 2px solid transparent; border-radius: 12px; padding: 12px; text-align: center; }
  .doc.sel { border-color: #7a9e7e; }
  .face { width: 72px; height: 72px; border-radius: 50%; margin: 4px auto 8px; display: grid; place-items: center; font: 700 26px system-ui; color: #fff; }
  .cal { background: #fff; border-radius: 12px; padding: 16px; margin-top: 18px; }
  .calhead { display: flex; align-items: center; justify-content: space-between; font-family: system-ui; }
  .arrow { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #f0ebe2; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .day { border-radius: 8px; padding: 10px; background: #f6f2ea; text-align: center; font-family: system-ui; }
  .day.sel { background: #7a9e7e; color: #fff; }
  .day.none { opacity: .4; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .slot { padding: 8px 12px; border-radius: 20px; border: 1px solid #7a9e7e; font-family: system-ui; }
  .slot.sel { background: #7a9e7e; color: #fff; }
  .book { margin-top: 18px; display: inline-block; }
  .appt { background: #fff; border-radius: 12px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #a33; background: #fbecec; }
  .note { background: #fff7e0; padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-top: 14px; }
</style>
</head>
<body>
<div class="top"><span id="logo"></span><span style="font:13px system-ui;color:#777">Patient: R. Mensah · MRN 88213</span></div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
<script src="../common.js"></script>
<script>
const { el, icon, textImage, clickable, act, state } = fx;
document.getElementById("logo").append(textImage("Riverside Family Clinic", { size: 22, weight: 700, color: "#4c6b50", font: "Georgia, serif" }));

const DOCTORS = [
  { name: "Dr. Imani Okafor", spec: "Family medicine", color: "#b4746a" },
  { name: "Dr. Tomas Lindqvist", spec: "Family medicine", color: "#6a86b4" },
  { name: "Dr. Priya Raman", spec: "Diabetes care", color: "#8a6ab4" },
];
const WEEKS = [
  ["Mon 2 Nov", "Tue 3 Nov", "Wed 4 Nov", "Thu 5 Nov", "Fri 6 Nov"],
  ["Mon 9 Nov", "Tue 10 Nov", "Wed 11 Nov", "Thu 12 Nov", "Fri 13 Nov"],
];
// Deterministic availability so tasks have one right answer.
function slotsFor(doc, day) {
  const seed = [...(doc + day)].reduce((a, c) => a + c.charCodeAt(0), 0);
  if (seed % 4 === 0) return [];
  const all = ["08:30", "09:00", "09:30", "10:15", "11:00", "14:00", "15:30", "16:45"];
  return all.filter((_, i) => (seed >> i) % 3 !== 0);
}

let tab = "book", doc = null, week = 0, day = null, slot = null;

async function render() {
  const st = await state();
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren();
  for (const [k, label] of [["book", "Book a visit"], ["mine", "My appointments"]]) {
    tabs.append(clickable(el("div", { class: "tab" + (tab === k ? " on" : "") }, label), () => { tab = k; render(); }));
  }
  const main = document.getElementById("main");
  main.replaceChildren();

  if (tab === "book") {
    main.append(el("h2", { style: "margin:0 0 12px;font-weight:normal" }, "1. Choose a clinician"));
    const grid = el("div", { class: "docs" });
    for (const d of DOCTORS) {
      const card = el("div", { class: "doc" + (doc === d.name ? " sel" : "") });
      card.append(el("div", { class: "face", style: `background:${d.color}` }, d.name.split(" ").slice(1).map((w) => w[0]).join("")));
      card.append(textImage(d.name, { size: 14, weight: 700 }), el("br"), textImage(d.spec, { size: 12, weight: 400, color: "#777" }));
      grid.append(clickable(card, () => { doc = d.name; day = null; slot = null; render(); }));
    }
    main.append(grid);
    if (doc) {
      const cal = el("div", { class: "cal" });
      const prev = clickable(el("div", { class: "arrow" }, icon(ICONS.left, 18)), () => { week = Math.max(0, week - 1); day = null; render(); });
      const next = clickable(el("div", { class: "arrow" }, icon(ICONS.right, 18)), () => { week = Math.min(1, week + 1); day = null; render(); });
      cal.append(el("div", { class: "calhead" }, prev, el("strong", {}, week === 0 ? "This week" : "Next week"), next));
      const days = el("div", { class: "days" });
      for (const d of WEEKS[week]) {
        const n = slotsFor(doc, d).length;
        const cell = el("div", { class: "day" + (day === d ? " sel" : "") + (n ? "" : " none") }, d.split(" ").slice(0, 2).join(" "), el("br"), el("small", {}, n ? `${n} open` : "full"));
        if (n) clickable(cell, () => { day = d; slot = null; render(); });
        days.append(cell);
      }
      cal.append(days);
      if (day) {
        const slots = el("div", { class: "slots" });
        for (const t of slotsFor(doc, day)) slots.append(clickable(el("div", { class: "slot" + (slot === t ? " sel" : "") }, t), () => { slot = t; render(); }));
        cal.append(slots);
      }
      if (slot) {
        const b = el("div", { class: "book" });
        b.append(textImage("Book this appointment", { size: 15, weight: 700, color: "#fff", bg: "#4c6b50", pad: 10 }));
        clickable(b, async () => {
          const res = await act({ type: "book", doctor: doc, day, time: slot });
          main.replaceChildren(el("div", { class: "appt" }, el("div", {}, el("strong", {}, "Booked. "), `${doc}, ${day} at ${slot}. Confirmation ${res.result}.`)));
          doc = day = slot = null;
        });
        cal.append(b);
      }
      main.append(cal);
    }
    main.append(el("div", { class: "note" }, "Need a same-day visit? Call the front desk at 555-0142."));
  }

  if (tab === "mine") {
    main.append(el("h2", { style: "margin:0 0 12px;font-weight:normal" }, "Upcoming"));
    if (!st.appointments.length) main.append(el("p", {}, "No upcoming appointments."));
    for (const a of st.appointments) {
      const x = clickable(el("div", { class: "x" }, icon(ICONS.x, 16)), async () => {
        if (!confirm("Cancel this appointment?")) return;
        await act({ type: "cancel", id: a.id }); render();
      });
      main.append(el("div", { class: "appt" }, el("div", {}, el("strong", {}, `${a.day}, ${a.time}`), el("br"), `${a.doctor} · ${a.id}`), x));
    }
  }
}
render();
</script>
</body>
</html>
