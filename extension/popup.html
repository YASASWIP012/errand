<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Errand</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; width: 300px; margin: 0; padding: 16px; background: #f6f1e7; color: #15130f; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #4a4439; }
  button { width: 100%; padding: 12px; font: 700 16px system-ui; border: 0; border-radius: 10px; background: #ff5a1f; color: #fff; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #1546ff; outline-offset: 2px; }
  label { display: block; margin-top: 14px; font-size: 13px; color: #4a4439; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 2px solid #ddd3c2; border-radius: 8px; }
  #status { margin-top: 12px; min-height: 1.4em; }
  kbd { font: 12px ui-monospace, monospace; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
  <h1>Errand</h1>
  <p>Names the controls on this page that your screen reader can't. Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd>.</p>
  <button id="go" type="button">Make this page readable</button>
  <div id="status" role="status" aria-live="polite"></div>
  <label for="server">Errand server</label>
  <input id="server" placeholder="http://localhost:8787">
  <script src="popup.js"></script>
</body>
</html>
